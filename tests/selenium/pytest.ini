; Konfigurasi pytest khusus tes Selenium. File ini membuat rootdir = tests/selenium,
; jadi .pytest_cache dan import `from conftest import ...` selalu berpusat di folder ini
; walaupun pytest dijalankan dari root repo.
[pytest]
testpaths = .
python_files = test_*.py
addopts = -ra
norecursedirs = .venv hasil __pycache__
